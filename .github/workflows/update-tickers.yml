# 每周重新生成 stock-price/tickers.json（美股代码清单 + 热门/冷门分级 + 英文撞车词）
# 数据源任一失败时脚本不写文件，这次就不提交，保留上一版。
name: update-tickers

on:
  schedule:
    - cron: '17 10 * * 1'   # 每周一 10:17 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build tickers.json
        run: node stock-price/tools/build-tickers.js
      - name: Run tests
        run: node stock-price/run-tests.js > /dev/null
      - name: Commit if changed
        run: |
          if git diff --quiet -- stock-price/tickers.json; then
            echo "tickers.json unchanged"; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stock-price/tickers.json
          git commit -m "chore(stock-price): update tickers.json"
          git push
